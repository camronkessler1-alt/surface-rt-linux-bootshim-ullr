name: Build Surface RT BootShim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ARM32 BootShim
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1

          & $msbuild "Boot Shim.sln" `
            /m `
            /p:Configuration=Debug `
            /p:Platform=ARM `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:PlatformToolset=v143

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload BootShim
        uses: actions/upload-artifact@v4
        with:
          name: surface-rt-bootshim
          path: build/BootShim/ARM/Debug/BootShim.efi
          if-no-files-found: error
